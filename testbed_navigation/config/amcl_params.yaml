# AMCL (Adaptive Monte-Carlo Localization) for Testbed-T1.0.0   (ROS 2 Humble / Nav2 1.1.x)
#
# AMCL compares each LaserScan with the static map and keeps a cloud of pose
# hypotheses ("particles"). It publishes the map -> odom transform; the diff-drive
# plugin in Gazebo already publishes odom -> base_footprint.
amcl:
  ros__parameters:
    use_sim_time: true

    # --- frames / topics (must match the robot) --------------------------------
    base_frame_id: "base_footprint"   # root of the robot (diff-drive plugin: robot_base_frame)
    odom_frame_id: "odom"             # diff-drive plugin: odometry_frame
    global_frame_id: "map"
    scan_topic: scan                  # lidar plugin remaps its output to /scan
    tf_broadcast: true
    transform_tolerance: 1.0

    # --- initial pose: where the robot is spawned in Gazebo --------------------
    # (testbed_gazebo/launch/spawn_testbed.launch.py -> x=0.0, y=5.0, yaw=0.0).
    # The map frame coincides with the Gazebo world frame (checked on the walls
    # and the spheres), so no offset is needed.
    set_initial_pose: true
    always_reset_initial_pose: false
    initial_pose:
      x: 0.0
      y: 5.0
      z: 0.0
      yaw: 0.0

    # --- motion model ----------------------------------------------------------
    robot_model_type: "nav2_amcl::DifferentialMotionModel"
    alpha1: 0.2    # rotation noise from rotation
    alpha2: 0.2    # rotation noise from translation
    alpha3: 0.2    # translation noise from translation
    alpha4: 0.2    # translation noise from rotation
    alpha5: 0.2    # (only used by the omni model)

    # --- sensor model ----------------------------------------------------------
    laser_model_type: "likelihood_field"
    laser_min_range: 0.1       # same as <min> of the lidar in testbed.gazebo
    laser_max_range: 10.0      # same as <max> of the lidar in testbed.gazebo
    max_beams: 60
    laser_likelihood_max_dist: 2.0
    sigma_hit: 0.2
    z_hit: 0.5
    z_max: 0.05
    z_rand: 0.5
    z_short: 0.05
    lambda_short: 0.1
    do_beamskip: false
    beam_skip_distance: 0.5
    beam_skip_error_threshold: 0.9
    beam_skip_threshold: 0.3

    # --- particle filter -------------------------------------------------------
    min_particles: 500
    max_particles: 2000
    pf_err: 0.05
    pf_z: 0.99
    resample_interval: 1
    recovery_alpha_fast: 0.0
    recovery_alpha_slow: 0.0
    update_min_d: 0.2          # only update the filter after moving 0.2 m ...
    update_min_a: 0.2          # ... or rotating 0.2 rad
    save_pose_rate: 0.5
    first_map_only: false
